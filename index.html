<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Joy Klemt | Portfolio</title>
  <link rel="icon" type="image/x-icon" href="favicon_io/favicon.ico">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Hero: bild täcker hela headern, text ovanpå -->
  <header class="hero">
    <img 
      src="Joy Klemt portfolio.png" 
      alt="Portfolio" 
      class="hero-image"
    >
  </header>

  <main>
    <!-- Om mig / Vad jag gör -->
    <section class="about">
      <h2 id="about-heading">Vad jag gör</h2>
      <p id="about-text" class="about-text">Text laddas från content.json</p>
    </section>

    <!-- Mina appar: klickbara kort -->
    <section class="apps">
      <h2 class="apps-heading">Mina appar</h2>
      <div id="apps-grid" class="apps-grid">
        <!-- App-kort skapas av script.js -->
      </div>
    </section>
  </main>

  <!-- Footer -->
  <footer class="footer">
    <p id="footer-text">Joy Klemt Portfolio</p>
    <div id="footer-contact" class="footer-contact"></div>
  </footer>

  <script src="script.js"></script>
</body>
</html>
